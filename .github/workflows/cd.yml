name: CD

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install ALSA/PortMidi dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libportmidi-dev

      - name: Build
        run: bash ./scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: shubert-linux
          path: build/shubert-linux-x64-*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: bash ./scripts/build-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: shubert-mac
          path: build/shubert-mac-*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        shell: cmd
        run: scripts\build-win.bat

      - uses: actions/upload-artifact@v4
        with:
          name: shubert-win
          path: build/shubert-win-x64-*.zip

  docker-publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "tags=dobrikov91/shubert:latest,dobrikov91/shubert:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    needs: [ build-linux, build-macos, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
